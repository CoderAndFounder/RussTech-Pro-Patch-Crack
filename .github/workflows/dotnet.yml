name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore RussTechProPatch.csproj

      - name: Build
        run: dotnet build RussTechProPatch.csproj -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish RussTechProPatch.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussTechProPatch
          path: dist/RussTechProPatch.exe
